syntax = "proto3";

package com.ecommerce.saga.orchestration.grpc.inventory;

option java_package = "com.ecommerce.saga.orchestration.grpc.inventory";
option java_outer_classname = "InventoryProto";
option java_multiple_files = true;

service InventoryGrpcService {
  // sync for check stock availability before saga begins
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  rpc ReservedStock(ReservedStockRequest) returns (ReservedStockRequest);
}

message CheckStockRequest {
  repeated StockItem items = 1;
}

message StockItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  optional bool available = 1;
  repeated StockAvailability availability = 2;
}

message StockAvailability {
  string product_id = 1;
  int32 requested = 2;
  int32 available = 3;
  optional bool sufficient = 4;
}

message ReservedStockRequest {
  string order_id = 1;
  repeated StockItem items = 2;
}

message ReservedStockResponse {
  bool success = 1;
  string reservation_id = 2;
  string error_message = 3;
}